name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: ketoan }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ketoan" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_pass@localhost:5432/ketoan
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/ketoan
      SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: psql "$DATABASE_ADMIN_URL" -f docker/postgres/init/01-roles.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm -F @kt/api exec playwright install --with-deps chromium # kiểm thử in PDF của API cần trình duyệt
      - run: pnpm test
  invariants: # bất biến 1–4, 6 (fast-check) và bộ dữ liệu mẫu XYZ trên PostgreSQL thật; chạy riêng vì lâu, `test` bỏ qua thư mục test/invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: ketoan }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ketoan" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_pass@localhost:5432/ketoan
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/ketoan
      SESSION_SECRET: ci-secret
      INVARIANTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: psql "$DATABASE_ADMIN_URL" -f docker/postgres/init/01-roles.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm -F @kt/api test -- test/invariants test/sample-xyz.test.ts
  e2e:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: ketoan }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ketoan" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_pass@localhost:5432/ketoan
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/ketoan
      SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: psql "$DATABASE_ADMIN_URL" -f docker/postgres/init/01-roles.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm -F @kt/web exec playwright install --with-deps chromium
      - run: pnpm -F @kt/api cli create-admin --username e2e --password 'Matkhau1!' --tenant-code E2E --tenant-name "Công ty E2E"
      # công ty riêng cho các spec chế độ kế toán / chưa có năm tài chính (điều kiện trước ghi ở đầu từng spec)
      - run: pnpm -F @kt/api cli create-admin --username e2ehkd --password 'Matkhau1!' --tenant-code E2EHKD --tenant-name "Hộ kinh doanh E2E"
      - run: pnpm -F @kt/api cli create-admin --username e2edn --password 'Matkhau1!' --tenant-code E2EDN --tenant-name "Doanh nghiệp siêu nhỏ E2E"
      - run: pnpm -F @kt/api cli create-admin --username e2enoyear --password 'Matkhau1!' --tenant-code E2ENOYEAR --tenant-name "Công ty E2E chưa có năm"
      - run: pnpm -F @kt/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
