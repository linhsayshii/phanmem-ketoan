name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: ketoan }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ketoan" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_pass@localhost:5432/ketoan
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/ketoan
      SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: psql "$DATABASE_ADMIN_URL" -f docker/postgres/init/01-roles.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm -F @kt/api exec playwright install --with-deps chromium # kiểm thử in PDF của API cần trình duyệt
      - run: pnpm test
  e2e:
    needs: test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: ketoan }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ketoan" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_pass@localhost:5432/ketoan
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/ketoan
      SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: psql "$DATABASE_ADMIN_URL" -f docker/postgres/init/01-roles.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm -F @kt/web exec playwright install --with-deps chromium
      - run: pnpm -F @kt/api cli create-admin --username e2e --password 'Matkhau1!' --tenant-code E2E --tenant-name "Công ty E2E"
      - run: pnpm -F @kt/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
