services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ketoan
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ketoan"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    init: true # tiến trình init chuyển SIGTERM cho lệnh con; lệnh chạy qua sh -c nên không có init thì tín hiệu dừng không tới node
    environment:
      DATABASE_URL: postgres://app_user:app_pass@postgres:5432/ketoan
      DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/ketoan
      SESSION_SECRET: ${SESSION_SECRET:-doi-chuoi-nay-khi-trien-khai}
      SESSION_TTL_HOURS: "12"
      COOKIE_SECURE: "false"
      TRUST_PROXY: "1"
      PORT: "3000"
      WEB_ORIGIN: http://localhost:8080
      BACKUP_DIR: /backups
      ATTACHMENT_DIR: /attachments
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-} # in URL webhook ngân hàng; sau TLS phải đặt https://...
      EINVOICE_ALLOWED_HOSTS: ${EINVOICE_ALLOWED_HOSTS:-}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - backups:/backups:ro
      - attachments:/attachments
    depends_on:
      postgres: { condition: service_healthy }
    command: ["sh", "-c", "node --import tsx packages/db/src/migrate-cli.ts && exec node --import tsx apps/api/src/server.ts"]

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app_user:app_pass@postgres:5432/ketoan
      DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/ketoan
      BACKUP_DIR: /backups
      BACKUP_CRON: "0 2 * * *"
      BACKUP_KEEP: "14"
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-} # đối soát hóa đơn điện tử mở mật khẩu nhà cung cấp
      EINVOICE_ALLOWED_HOSTS: ${EINVOICE_ALLOWED_HOSTS:-}
    stop_grace_period: 70s # chờ boss.stop graceful (60 giây) xong trước khi Docker SIGKILL
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  backups:
  attachments:
